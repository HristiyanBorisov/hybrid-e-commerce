# Look the services up in Docker's DNS on each request (cached 10s) instead of once at startup:
# when a container is recreated it gets a new IP, and nginx would keep sending traffic to the old one.
resolver 127.0.0.11 valid=10s;

# WebSockets: pass the browser's "Upgrade" request on to the service (plain requests keep "Connection: close")
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- Public entry point (published as localhost:8080)
server {
    listen 80;
    server_name _;

    # Laravel's public folder (mounted read-only from admin-service/public)
    root /app/public;
    index index.php;

    # Product images and CSV imports up to 10 MB (PHP allows the same)
    client_max_body_size 10m;

    set $api_gateway http://api-gateway:3000;
    set $admin_service admin-service:9000;
    set $reverb http://reverb:8080;

    # NestJS API gateway — including its WebSocket for live order updates (/api/socket.io)
    location /api/ {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel Reverb: the WebSocket server behind the admin panel's live notifications (Laravel Echo)
    location /app/ {
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Service-to-service API: never reachable from outside (see the internal server below)
    location /internal/ {
        return 404;
    }

    # Laravel admin panel: serve static files (incl. /storage images) directly, everything else goes to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $admin_service;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Hide dotfiles such as .htaccess
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ---- Internal entry point: the API gateway calls Laravel's /internal/v1 API here.
# Port 8081 is not published, so only containers on the Docker network can reach it (and they need the API key).
server {
    listen 8081;
    server_name _;
    root /app/public;

    set $admin_service admin-service:9000;

    location /internal/ {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass $admin_service;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        return 404;
    }
}
