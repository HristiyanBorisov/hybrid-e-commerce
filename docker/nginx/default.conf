server {
    listen 80;
    server_name _;

    # Laravel's public folder (mounted read-only from admin-service/public)
    root /app/public;
    index index.php;

    # NestJS API gateway
    location /api/ {
        proxy_pass http://api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel admin panel: serve static files directly, everything else goes to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass admin-service:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Hide dotfiles such as .htaccess
    location ~ /\.(?!well-known) {
        deny all;
    }
}
