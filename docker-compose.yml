name: hybrid-ecommerce

services:
  # Single entry point: /api/* → NestJS, everything else → Laravel.
  # One domain means one cookie reaches both services (shared session).
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-service/public:/app/public:ro
      # Uploaded product images, served at /storage (public/storage links here)
      - ./admin-service/storage/app/public:/app/storage/app/public:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      admin-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/up && wget -qO /dev/null http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS — public API gateway (users, inventory, orders)
  api-gateway:
    build:
      context: ./api-gateway
      target: dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: ./api-gateway/.env
    environment:
      DB_DATABASE: ${GATEWAY_DB_NAME}
      DB_USERNAME: ${GATEWAY_DB_USER}
      DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - ./api-gateway:/app
      # Signing (private) and verifying (public/) key for login tokens — created by `make keys`
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Laravel — admin panel (catalog owner), served by PHP-FPM behind nginx
  admin-service:
    build:
      context: ./admin-service
      target: dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DB_DATABASE: ${ADMIN_DB_NAME}
      DB_USERNAME: ${ADMIN_DB_USER}
      DB_PASSWORD: ${ADMIN_DB_PASSWORD}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - ./admin-service:/app
      # Only the public key: the admin service can check login tokens but never create them
      - ./keys/public:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Laravel queue worker — same image and config as admin-service, different command.
  # queue:listen reloads the code for every job, so code changes apply without a restart.
  admin-worker:
    extends: admin-service
    command: ["php", "artisan", "queue:listen", "--tries=3"]

  # Laravel Reverb — WebSocket server for the admin panel's live notifications (Laravel Echo).
  # Same image and config as admin-service; browsers reach it through nginx (/app).
  reverb:
    extends: admin-service
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One server, separate databases: each service has its own role and can't reach the other's data
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_DB_NAME: ${ADMIN_DB_NAME}
      ADMIN_DB_USER: ${ADMIN_DB_USER}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD}
      GATEWAY_DB_NAME: ${GATEWAY_DB_NAME}
      GATEWAY_DB_USER: ${GATEWAY_DB_USER}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache, sessions and queues for both services
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Product search for the API gateway: typo-tolerant, ranked by relevance.
  # One node with security off — for development only (production needs passwords and TLS).
  elasticsearch:
    image: elasticsearch:9.5.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Without this, a nearly full disk would make the index read-only — confusing on a laptop
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Catches every outgoing email — inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  postgres-data:
  elasticsearch-data:
