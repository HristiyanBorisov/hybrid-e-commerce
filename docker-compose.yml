name: hybrid-ecommerce

services:
  # Single entry point: /api/* → NestJS, everything else → Laravel.
  # One domain means one cookie reaches both services (shared session).
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-service/public:/app/public:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      admin-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/up && wget -qO /dev/null http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS — public API gateway (users, inventory, orders)
  api-gateway:
    build:
      context: ./api-gateway
      target: dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: ./api-gateway/.env
    environment:
      DB_DATABASE: ${GATEWAY_DB_NAME}
      DB_USERNAME: ${GATEWAY_DB_USER}
      DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
    volumes:
      - ./api-gateway:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Laravel — admin panel (catalog owner), served by PHP-FPM behind nginx
  admin-service:
    build:
      context: ./admin-service
      target: dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DB_DATABASE: ${ADMIN_DB_NAME}
      DB_USERNAME: ${ADMIN_DB_USER}
      DB_PASSWORD: ${ADMIN_DB_PASSWORD}
    volumes:
      - ./admin-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Laravel queue worker — same image and config as admin-service, different command.
  # queue:listen reloads the code for every job, so code changes apply without a restart.
  admin-worker:
    extends: admin-service
    command: ["php", "artisan", "queue:listen", "--tries=3"]

  # One server, separate databases: each service has its own role and can't reach the other's data
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_DB_NAME: ${ADMIN_DB_NAME}
      ADMIN_DB_USER: ${ADMIN_DB_USER}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD}
      GATEWAY_DB_NAME: ${GATEWAY_DB_NAME}
      GATEWAY_DB_USER: ${GATEWAY_DB_USER}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache, sessions and queues for both services
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every outgoing email — inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  postgres-data:
